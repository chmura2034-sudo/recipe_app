{% extends "base.html" %}
{% block title %}Zmiana hasła – Szczypta Smaku{% endblock %}

{% block content %}
  <a class="back-link" href="{{ url_for('admin_dashboard' if current_user.is_admin else 'redaktor_dashboard') }}">
    &larr; Wróć do panelu
  </a>

  <div class="form-page">
    <h1>Zmiana hasła</h1>
    <p class="muted-info">Zalogowany jako: <strong>{{ current_user.username }}</strong></p>

    <form method="post" class="styled-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <label for="current_password">Obecne hasło</label>
      <input type="password" id="current_password" name="current_password" required autocomplete="current-password">

      <label for="new_password">Nowe hasło (min. {{ min_password_length }} znaków)</label>
      <input type="password" id="new_password" name="new_password" required
             minlength="{{ min_password_length }}" autocomplete="new-password">

      <label for="new_password_confirm">Powtórz nowe hasło</label>
      <input type="password" id="new_password_confirm" name="new_password_confirm" required
             minlength="{{ min_password_length }}" autocomplete="new-password">

      <button type="submit" class="btn">Zmień hasło</button>
    </form>
  </div>
{% endblock %}
